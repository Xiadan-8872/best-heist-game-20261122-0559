<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Velvet Vault — Midnight Heist</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0a12; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; width: min(1280px, 100vw); aspect-ratio: 1280 / 800; }
  canvas { display: block; width: 100%; height: 100%; background: #14101c; cursor: crosshair; }
  #ap-status { position: absolute; left: -9999px; top: 0; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="ap-status"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
